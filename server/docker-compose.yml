services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lecturapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-lecturapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lecturapp}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-lecturapp}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-lecturapp}
      NAS_MOUNT_PATH: /mnt/nas
    volumes:
      - ${NAS_HOST_PATH:-/mnt/nas}:/mnt/nas:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
